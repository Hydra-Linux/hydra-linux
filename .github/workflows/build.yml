name: Build Hydra Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libsqlite3-dev libarchive-dev libgpgme-dev
      - name: Build flash
        run: make -C flash
      - name: Test flash
        run: ./flash/flash --help
      - name: Upload flash binary
        uses: actions/upload-artifact@v4
        with:
          name: flash-binary
          path: flash/flash

  lint-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check recipe syntax
        run: |
          errors=0
          for f in recipes/*/*/recipe.sh; do
            if bash -n "$f" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          echo "---"
          if [ "$errors" -eq 0 ]; then
            echo "All recipes passed!"
          else
            echo "$errors recipe(s) failed!"
            exit 1
          fi

  check-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check bootstrap scripts syntax
        run: |
          for f in bootstrap/*.sh; do
            bash -n "$f" && echo "OK: $f" || echo "FAIL: $f"
          done
