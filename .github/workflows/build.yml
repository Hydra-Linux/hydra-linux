name: Build Hydra Linux

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-flash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc make libsqlite3-dev libarchive-dev libgpgme-dev
      - name: Build flash
        run: make -C flash
      - name: Test flash
        run: ./flash/flash --help
      - name: Run flash test suite
        run: make test
      - name: Upload flash binary
        uses: actions/upload-artifact@v4
        with:
          name: flash-binary
          path: flash/flash

  lint-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check recipe and script syntax
        run: |
          errors=0
          for f in recipes/*/*/recipe.sh; do
            if bash -n "$f" 2>/dev/null; then
              echo "OK: $f"
            else
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          echo "---"
          for f in bootstrap/*.sh iso/*.sh dev/*.sh; do
            if [ -f "$f" ]; then
              bash -n "$f" && echo "OK: $f" || echo "FAIL: $f"
            fi
          done
          echo "---"
          if [ "$errors" -eq 0 ]; then
            echo "All scripts passed!"
          else
            echo "$errors script(s) failed!"
            exit 1
          fi

  deploy-website:
    runs-on: ubuntu-latest
    needs: [build-flash, lint-recipes]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy website to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          destination_dir: ./
