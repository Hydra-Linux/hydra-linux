set default="0"
set timeout="5"
set gfxmode=1920x1080
set gfxpayload=keep
terminal_output gfxterm

if loadfont unicode; then
  if [ -f /boot/grub/themes/hydra/hydra-logo.png ]; then
    background_image /boot/grub/themes/hydra/hydra-logo.png
  fi
fi

menuentry "Hydra Linux Live" --id live {
  linux /boot/vmlinuz quiet splash
  initrd /boot/initramfs.img
}

menuentry "Hydra Linux Live (Safe Mode)" --id safe {
  linux /boot/vmlinuz nomodeset disable_modules=radeon,nouveau nofb
  initrd /boot/initramfs.img
}

menuentry "Boot from First Disk" --id disk {
  set root=(hd0)
  chainloader +1
}

menuentry "Shutdown" --id shutdown {
  halt
}

menuentry "Reboot" --id reboot {
  reboot
}
